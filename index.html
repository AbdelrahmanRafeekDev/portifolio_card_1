<!DOCTYPE html>
<html lang="en">
    <head>
        <title>portfolio_card</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            @font-face{
                font-family: 'p';
                src: url('p_font.ttf') format('truetype');
            }
            body{
                background-color:rgb(40 40 40);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin:0;
            }
            .card{
                /* border: 5px solid black; */
                border-radius: 10px;
                background-color:rgb(80 76 76) ;
                color:white;
                width: 350px;
                height: auto;
                padding: 10px;
                box-shadow: 0 0 10px white;
                text-align: center;
                transition: all 0.3s ease;  

            }
            .button{
                
                background-color:white;
                color:black;
                border: 1px solid black;
                border-radius: 5px;
                padding: 5px;
                transition: all 0.3s ease;
                margin: 5px;
            }
            .button:hover{
                background-color: blue;
                color: white;
                transform: scale(1.1);
            }
           
            .card:hover{
                transform: scale(1.05);
            }
            #main_head{
                color:goldenrod;
                text-shadow: 0 0 2px white;
                transition: all 0.3s ease;
            }
            #main_head:hover{
                transform: scale(1.02);
            }

            .personalphoto{
                width: 75px;
                border-radius: 50%;
                box-shadow: 0 0 15px white;
                transition: all 0.3s ease;
            
            }
            .personalphoto:hover{
                transform: scale(1.05) rotate(15deg);

            }
            .font{
                font-family: 'p',Arail,sans-serif;
            }


        </style>
    </head>
    <body>
        <div class="card">
            <img src="me.jpg" alt="AbdelrahmanRafeek personal photo" class="personalphoto">
            <h1 id="main_head">Hello, I'm Abdelrahman Rafeek</h1>
            <p class="font">AI engineer & Full Stack Developer</p>
            <a href="https://www.linkedin.com/in/abdelrahman-rafeek-915774307" class="button" target="_blank">LinkedIn</a>
            <a href="https://github.com/AbdelrahmanRafeekDev" class="button" target="_blank">Visit My GitHub</a>
        </div>
    </body>





</html>
